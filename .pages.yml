# Oppsett for Pages CMS (https://pagescms.org) – et enkelt redigeringsverktøy i nettleseren.
media:
  input: innhold/filer
  output: /filer

content:
  - name: aktuelt
    label: Aktuelt
    type: collection
    path: innhold/aktuelt
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [tittel, dato]
      default:
        sort: dato
        order: desc
    fields:
      - name: tittel
        label: Tittel
        type: string
        required: true
      - name: dato
        label: Dato
        description: Saken vises på forsiden til og med denne dagen.
        type: date
        required: true
      - name: vis_til
        label: Vis til (valgfritt)
        description: Fyll ut hvis saken skal vises lenger enn datoen over.
        type: date
      - name: stemning
        label: Stemning (valgfritt)
        description: Noe som driver over siden mens saken er åpen.
        type: select
        options:
          values:
            - value: host
              label: Høst – blader som blåser forbi
            - value: var
              label: Vår – løvetannfrø og villblomster
      - name: tittelbilde
        label: Plakat – tittel som bilde (valgfritt)
        description: Fyller du ut ett eller flere bildefelt, står saken i listen som et lite tittel- og datobilde. Klikker man på den, åpnes en plakat der delene kan flyttes rundt. Det som mangler, vises som vanlig tekst.
        type: image
      - name: tittelbilde_hover
        label: Plakat – tittel i farger når musa holdes over (valgfritt)
        description: Samme bilde som tittelen, bare i andre farger. Uten dette blir tittelen høstoransje.
        type: image
      - name: datobilde
        label: Plakat – dato som bilde (valgfritt)
        type: image
      - name: datobilde_hover
        label: Plakat – dato i farger når musa holdes over (valgfritt)
        description: Samme bilde som datoen, bare i andre farger. Uten dette blir datoen høstoransje.
        type: image
      - name: illustrasjon
        label: Plakat – illustrasjon (valgfritt)
        type: image
      - name: illustrasjon_tekst
        label: Plakat – beskrivelse av illustrasjonen (valgfritt)
        description: Leses opp for blinde og svaksynte, f.eks. «Tegning av et smilende gresskar». La stå tom hvis bildet bare er pynt.
        type: string
      - name: tekstbilde
        label: Plakat – brødtekst som bilde (valgfritt)
        description: Skriv også teksten i tekstfeltet under, så den kan leses av skjermlesere og søkemotorer.
        type: image
      - name: body
        label: Tekst
        type: rich-text

  - name: praktisk-informasjon
    label: Praktisk informasjon til beboere
    type: collection
    path: innhold/praktisk-informasjon
    filename: "{primary}.md"
    view:
      fields: [tittel, rekkefolge]
      default:
        sort: rekkefolge
        order: asc
    fields:
      - name: tittel
        label: Tittel
        type: string
        required: true
      - name: rekkefolge
        label: Plass i menyen
        description: 1 er øverst.
        type: number
      - name: body
        label: Tekst
        type: rich-text

  - name: referater
    label: Årsmøter
    type: collection
    path: innhold/referater
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [tittel, dato]
      default:
        sort: dato
        order: desc
    fields:
      - name: tittel
        label: Tittel
        description: For eksempel «Styremøte 16. mars 2026».
        type: string
        required: true
      - name: dato
        label: Møtedato
        type: date
        required: true
      - name: body
        label: Referat
        type: rich-text
